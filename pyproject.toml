[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geno-dev"
version = "0.1.0"
description = "Developer workflow skills, local usage recording, and behavioral skill evaluations"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "42euge" }]
dependencies = ["anthropic>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
geno-dev = "geno_dev.cli:main"

[tool.setuptools.packages.find]
include = ["geno_dev*"]
